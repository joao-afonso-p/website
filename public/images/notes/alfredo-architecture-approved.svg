<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 980" role="img" aria-labelledby="title description">
  <title id="title">Alfredo system architecture</title>
  <desc id="description">A phone and computer sync an Obsidian vault and Alfredo configuration through GitHub. Telegram connects to OpenClaw running in WSL2 on an always-on Windows PC, and OpenClaw sends model requests to Codex.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#315e99"/></marker>
    <style>
      .paper { fill: #f7f6f1; }
      .frame { fill: none; stroke: #dedbd2; stroke-width: 1.2; }
      .host { fill: #f3f1eb; stroke: #c9c6bc; stroke-width: 1.5; }
      .node { fill: #faf9f5; stroke: #c9c6bc; stroke-width: 1.5; }
      .primary { fill: #eaf0f7; stroke: #9bb5d5; stroke-width: 1.5; }
      .link { fill: none; stroke: #315e99; stroke-width: 2; marker-end: url(#arrow); }
      .both { fill: none; stroke: #315e99; stroke-width: 1.8; marker-start: url(#arrow); marker-end: url(#arrow); }
      .title { font: 700 17px Arial, Helvetica, sans-serif; fill: #292925; text-anchor: middle; }
      .sub { font: 14px Arial, Helvetica, sans-serif; fill: #66665f; text-anchor: middle; }
      .mono { font: 13px 'Courier New', monospace; fill: #57574f; }
      .host-label { font: 13px 'Courier New', monospace; letter-spacing: 1.2px; fill: #57574f; }
      .label-bg { fill: #f7f6f1; }
    </style>
  </defs>
  <rect class="paper" width="700" height="980"/>
  <rect class="frame" x="16" y="16" width="668" height="948"/>

  <!-- Devices and cloud services -->
  <rect class="node" x="48" y="58" width="160" height="66" rx="4"/>
  <text class="title" x="128" y="98">Phone</text>
  <rect class="node" x="270" y="58" width="160" height="66" rx="4"/>
  <text class="title" x="350" y="98">Telegram</text>
  <rect class="node" x="492" y="58" width="160" height="66" rx="4"/>
  <text class="title" x="572" y="98">Computer</text>

  <rect class="primary" x="235" y="220" width="230" height="76" rx="4"/>
  <text class="title" x="350" y="251">GitHub</text>
  <text class="sub" x="350" y="275">Obsidian vault + Alfredo config</text>

  <!-- The always-on Windows host -->
  <rect class="host" x="50" y="350" width="600" height="410" rx="4"/>
  <text class="host-label" x="72" y="379">OLD WINDOWS PC · LEFT ON</text>

  <rect class="node" x="80" y="420" width="190" height="68" rx="4"/>
  <text class="title" x="175" y="449">WSL2</text>
  <text class="sub" x="175" y="472">Ubuntu</text>
  <rect class="primary" x="390" y="420" width="230" height="68" rx="4"/>
  <text class="title" x="505" y="449">OpenClaw gateway</text>
  <text class="sub" x="505" y="472">Alfredo agent runtime</text>

  <rect class="node" x="80" y="630" width="230" height="72" rx="4"/>
  <text class="title" x="195" y="660">Obsidian vault</text>
  <text class="sub" x="195" y="684">local checkout</text>
  <rect class="node" x="390" y="630" width="230" height="72" rx="4"/>
  <text class="title" x="505" y="660">Alfredo config</text>
  <text class="sub" x="505" y="684">local checkout</text>

  <rect class="node" x="260" y="850" width="180" height="72" rx="4"/>
  <text class="title" x="350" y="880">Codex</text>
  <text class="sub" x="350" y="904">OpenAI</text>

  <!-- Phone messaging and shared GitHub sync -->
  <path class="link" d="M208 91H268"/>
  <rect class="label-bg" x="207" y="65" width="62" height="20"/>
  <text class="mono" x="210" y="80">messages</text>

  <path class="both" d="M128 124C128 176 194 178 255 220"/>
  <rect class="label-bg" x="157" y="169" width="42" height="20"/>
  <text class="mono" x="160" y="184">sync</text>
  <path class="both" d="M445 220C500 175 572 178 572 124"/>
  <rect class="label-bg" x="493" y="169" width="42" height="20"/>
  <text class="mono" x="496" y="184">sync</text>

  <!-- Telegram route, routed around GitHub -->
  <path class="link" d="M430 91H480V385H505V418"/>

  <!-- GitHub to the two local checkouts; labels sit in the outer gutters -->
  <path class="both" d="M235 258L32 330V666H78"/>
  <rect class="label-bg" x="31" y="506" width="96" height="22"/>
  <text class="mono" x="34" y="522">pull / push</text>
  <path class="both" d="M465 258L668 330V666H622"/>
  <rect class="label-bg" x="548" y="506" width="96" height="22"/>
  <text class="mono" x="551" y="522">pull / push</text>

  <!-- Runtime and its local context -->
  <path class="link" d="M270 454H388"/>
  <path class="link" d="M440 488L270 628"/>
  <rect class="label-bg" x="331" y="535" width="42" height="21"/>
  <text class="mono" x="334" y="551">vault</text>
  <path class="link" d="M540 488V628"/>
  <rect class="label-bg" x="547" y="550" width="56" height="21"/>
  <text class="mono" x="550" y="566">config</text>

  <!-- Model requests leave the host and reach Codex -->
  <path class="link" d="M620 454H640V886H442"/>
  <rect class="label-bg" x="500" y="858" width="122" height="21"/>
  <text class="mono" x="503" y="874">model requests</text>
</svg>
