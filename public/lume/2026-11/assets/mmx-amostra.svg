<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Percurso planeado da missão MMX</title>
  <desc id="desc">Diagrama editorial da missão Martian Moons eXploration: lançamento da Terra em 20 de outubro de 2026, já realizado, e chegada a Marte prevista para 2027, observação e rover Idefix, recolha de amostra em Phobos em 2030 e cápsula de regresso à Terra em 2031.</desc>
  <defs>
    <style>
      .kicker{font:600 24px Arial,sans-serif;letter-spacing:4px;fill:#9eddec}.h{font:700 48px Arial,sans-serif;fill:#f6f1e7}.n{font:700 24px Arial,sans-serif;fill:#10203a}.t{font:400 21px Arial,sans-serif;fill:#dceaf2}.small{font:400 18px Arial,sans-serif;fill:#a9c4d2}.date{font:700 18px Arial,sans-serif;fill:#9eddec}.line{stroke:#8ed6e7;stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:10 13}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#102746"/>
  <g fill="#d9eff7" opacity=".8"><circle cx="95" cy="125" r="2"/><circle cx="255" cy="250" r="3"/><circle cx="433" cy="100" r="2"/><circle cx="670" cy="180" r="2"/><circle cx="970" cy="95" r="3"/><circle cx="1280" cy="165" r="2"/><circle cx="1490" cy="330" r="3"/><circle cx="1110" cy="730" r="2"/><circle cx="390" cy="720" r="2"/></g>
  <text x="80" y="83" class="kicker">MISSÃO MMX</text><text x="80" y="138" class="h">De Phobos à Terra, em cinco etapas</text>
  <path class="line" d="M220 640 C390 520,430 690,610 610 S800 410,940 500 S1130 650,1300 520"/>
  <path d="M1284 532 L1310 514 L1298 544 Z" fill="#8ed6e7"/>
  <g transform="translate(180 650)"><circle r="72" fill="#2f84b7"/><path d="M-72 4 Q-25-10 10 7 T72 0" fill="none" stroke="#c7ecdf" stroke-width="10"/><path d="M-50-38 Q-13-60 10-34" fill="none" stroke="#d9f1d4" stroke-width="9"/><text x="-62" y="116" class="n" fill="#f6f1e7">TERRA</text><text x="-74" y="146" class="date">Lançamento, 20 out. 2026 (realizado)</text></g>
  <g transform="translate(560 600)"><path d="M-58 6 L-20-16 L18-7 L62 5 L17 19 L-21 18 Z" fill="#e7edf0"/><path d="M-10-16 L10-55 L27-10" fill="#f3b95e"/><rect x="-105" y="-24" width="58" height="48" rx="3" fill="#5b85a6"/><rect x="50" y="-24" width="58" height="48" rx="3" fill="#5b85a6"/><path d="M-48 0 H-20 M18 0 H50" stroke="#d6e6e9" stroke-width="5"/><text x="-100" y="82" class="n" fill="#f6f1e7">CRUZEIRO</text><text x="-120" y="112" class="date">Rumo a Marte</text></g>
  <g transform="translate(920 470)"><circle r="125" fill="#b95740"/><circle r="108" fill="#d87850"/><path d="M-115-25 Q-20-72 110-35 M-116 28 Q0-9 120 30" fill="none" stroke="#f0a26f" stroke-width="13" opacity=".55"/><ellipse rx="170" ry="65" fill="none" stroke="#8ed6e7" stroke-width="4" stroke-dasharray="10 10" transform="rotate(-18)"/><circle cx="-145" cy="-12" r="14" fill="#9aa9a5"/><text x="-62" y="12" class="n" fill="#f6f1e7">MARTE</text><text x="-113" y="178" class="date">Órbita marciana, 2027</text></g>
  <g transform="translate(1160 360)"><path d="M-105 5 Q-50-55 16-33 Q83-20 107 34 Q48 78-32 58 Q-94 56-105 5" fill="#9da3a0"/><circle cx="-25" cy="-9" r="16" fill="#77827f"/><circle cx="50" cy="24" r="10" fill="#77827f"/><path d="M-88 52 C-30 80,55 75,101 39" fill="none" stroke="#697574" stroke-width="7"/><path d="M-19-50 L18-83" stroke="#f2bd61" stroke-width="7"/><circle cx="21" cy="-87" r="13" fill="#f2bd61"/><text x="-83" y="118" class="n" fill="#f6f1e7">PHOBOS</text><text x="-153" y="148" class="date">Observação e Idefix</text></g>
  <g transform="translate(1265 560)"><path d="M-65 35 L-30-30 L24-18 L58 27 L25 54 L-43 54 Z" fill="#dae4e3"/><path d="M-15-23 L28-75" stroke="#e7b55e" stroke-width="12"/><path d="M28-75 L68-71" stroke="#e7b55e" stroke-width="8"/><circle cx="73" cy="-71" r="10" fill="#f5d875"/><path d="M-27 53 L-52 78 M25 53 L49 78" stroke="#8ed6e7" stroke-width="8"/><text x="-102" y="120" class="n" fill="#f6f1e7">AMOSTRAGEM</text><text x="-132" y="150" class="date">Duas descidas, meta 2030</text></g>
  <g transform="translate(1370 660)"><path d="M-38 15 Q0-62 38 15 L22 54 H-22 Z" fill="#f1e6cf"/><path d="M-38 15 H38" stroke="#d3774d" stroke-width="8"/><path d="M-62 65 Q0 33 62 65" fill="none" stroke="#f1b65d" stroke-width="8"/><text x="-83" y="112" class="n" fill="#f6f1e7">CÁPSULA</text><text x="-116" y="142" class="date">Regresso à Terra, 2031</text></g>
  <g transform="translate(80 785)"><rect width="1050" height="76" rx="10" fill="#102846" stroke="#477b96"/><text x="25" y="31" class="small">Como ler: a MMX observa Phobos antes de escolher a zona de recolha. Idefix faz reconhecimento, a nave recolhe regolito e a cápsula traz a amostra.</text><text x="25" y="59" class="small">Lançamento realizado; restantes datas são metas comunicadas pela JAXA e ESA.</text></g>
</svg>
