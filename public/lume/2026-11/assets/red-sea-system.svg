    <path d="M285 185 L450 185 L488 238 L450 268 L300 250 Z"/>
    <path d="M462 255 L510 262 L505 405 L478 410 L466 334 Z"/>
    <path d="M493 402 L570 386 L610 668 L544 690 L508 575 Z"/>
    <path d="M573 674 L808 684 L930 635 L1020 650 L1065 714 L1008 770 L820 744 L620 730 Z"/>
    <path d="M1010 736 L1110 696 L1248 714 L1290 786 L1205 810 L1088 780 Z"/>
  </g>
  <g fill="none" stroke="#ef6a4c" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 14">
    <path d="M340 220 C430 225 463 253 484 320 C498 410 525 520 565 655 C620 700 720 710 830 714 C920 718 1010 745 1120 757"/>
  </g>
  <g fill="#ef6a4c" stroke="#151820" stroke-width="3">
    <circle cx="486" cy="317" r="13"/><circle cx="591" cy="688" r="13"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#151820">
    <g font-size="26" font-weight="700"><text x="160" y="355">EGITO</text><text x="310" y="306">SINAI</text><text x="638" y="330">ARÁBIA</text><text x="638" y="360">SAUDITA</text><text x="745" y="610">IÉMEN</text><text x="210" y="600">SUDÃO</text><text x="238" y="714">ERITREIA</text><text x="479" y="748">DJIBUTI</text><text x="1110" y="642">SOMÁLIA</text></g>
    <g font-size="22" font-style="italic" fill="#174e78"><text x="220" y="220">Mediterrâneo</text><text x="520" y="510">Mar Vermelho</text><text x="790" y="735">Golfo de Áden</text><text x="1120" y="840">Oceano Índico</text></g>
    <text x="402" y="290" font-size="22" font-weight="700">Canal de Suez</text>
    <text x="610" y="650" font-size="22" font-weight="700">Bab el-Mandeb</text>
    <text x="100" y="840" font-size="20" fill="#43505c">Linha tracejada: rota marítima esquemática Europa-Ásia. As formas terrestres e distâncias foram simplificadas para explicar o sistema.</text>
  </g>
  <g stroke="#151820" stroke-width="3" fill="none"><path d="M490 300 L462 282"/><path d="M605 643 L592 676"/></g>
</svg>
