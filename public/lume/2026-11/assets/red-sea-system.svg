<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Corredor marítimo entre Suez e o golfo de Áden</title>
  <desc id="desc">Diagrama esquemático do Mediterrâneo oriental, canal de Suez, Mar Vermelho, estreito de Bab el-Mandeb e golfo de Áden, com as margens do Egito, Sinai, Israel e Jordânia, Arábia Saudita, Iémen, Eritreia, Djibuti, Somália e o oceano Índico.</desc>
  <rect width="1400" height="900" fill="#f4f3ef"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#151820">
    <text x="80" y="82" font-size="42" font-weight="700">UM CORREDOR, DOIS GARGALOS</text>
    <text x="82" y="120" font-size="22" fill="#43505c">Esquema geográfico, não à escala. O tráfego entre a Europa e a Ásia passa por Suez e Bab el-Mandeb.</text>
  </g>
  <g stroke="#151820" stroke-width="4" stroke-linejoin="round">
    <path d="M110 185 L430 185 L492 238 L474 328 L520 414 L544 668 L420 744 L150 698 L90 550 L130 415 L95 305 Z" fill="#d9b98b"/>
    <path d="M585 215 L820 188 L965 274 L926 414 L846 468 L894 607 L810 707 L615 680 L568 505 L548 390 Z" fill="#ddb984"/>
    <path d="M1035 390 L1275 413 L1328 574 L1228 676 L1085 634 L1008 520 Z" fill="#d9b98b"/>
    <path d="M1050 682 L1270 714 L1325 840 L1100 850 L980 770 Z" fill="#d9b98b"/>
  </g>
