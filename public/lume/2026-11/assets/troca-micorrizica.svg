<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Troca micorrízica entre uma planta e um fungo</title>
  <desc id="desc">Diagrama original de uma raiz ligada a hifas no solo. Carbono segue da planta para o fungo; fósforo e azoto seguem do fungo para a raiz.</desc>
  <defs>
