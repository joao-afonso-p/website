<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Trajecto do carbono e Pelagothuria na zona mesopelágica</title>
  <desc id="desc">Diagrama original da coluna de água, desde a superfície iluminada até ao fundo abissal. A neve marinha desce e é interceptada por Pelagothuria entre 250 e 650 metros.</desc>
  <rect width="1200" height="800" fill="#176891"/>
  <path d="M0 82 C140 55 255 106 395 77 S660 109 815 76 S1030 103 1200 70 V0 H0Z" fill="#dff7f1" opacity=".92"/>
  <path d="M0 91 C155 64 265 118 408 87 S675 120 830 85 S1050 114 1200 82" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/>
  <text x="70" y="64" fill="#102536" font-family="Arial, sans-serif" font-size="30" font-weight="700">Superfície iluminada</text>
  <text x="70" y="101" fill="#183b4c" font-family="Arial, sans-serif" font-size="22">Fitoplâncton fixa carbono dissolvido</text>
  <g fill="#d4f6a2" opacity=".95"><circle cx="170" cy="145" r="12"/><circle cx="208" cy="175" r="8"/><circle cx="245" cy="135" r="10"/><circle cx="290" cy="165" r="7"/><circle cx="325" cy="129" r="9"/></g>
  <path d="M260 190 C260 320 285 390 300 518" stroke="#f5efe0" stroke-width="5" stroke-dasharray="8 12" fill="none"/>
  <path d="M340 205 C350 315 370 410 390 540" stroke="#f5efe0" stroke-width="4" stroke-dasharray="7 13" fill="none"/>
  <path d="M420 195 C438 335 448 430 455 580" stroke="#f5efe0" stroke-width="3" stroke-dasharray="6 13" fill="none"/>
  <text x="105" y="285" fill="#f5efe0" font-family="Arial, sans-serif" font-size="27" font-weight="700">Neve marinha</text>
  <text x="105" y="318" fill="#dcecf0" font-family="Arial, sans-serif" font-size="21">restos orgânicos e agregados afundam</text>
  <line x1="700" y1="330" x2="1125" y2="330" stroke="#88c8df" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="700" y1="570" x2="1125" y2="570" stroke="#88c8df" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="920" y="320" fill="#c8e9f3" font-family="Arial, sans-serif" font-size="21">250 m</text>
  <text x="920" y="560" fill="#c8e9f3" font-family="Arial, sans-serif" font-size="21">650 m</text>
  <path d="M650 380 C730 310 885 310 960 400 C895 478 735 477 650 380Z" fill="#eea5b7" stroke="#ffe0e4" stroke-width="7"/>
  <path d="M767 380 C792 337 830 326 862 333 C842 369 838 403 861 442 C821 443 786 426 767 380Z" fill="#f9d6dc" opacity=".9"/>
  <path d="M657 381 C690 355 714 341 747 340" fill="none" stroke="#ffe8ea" stroke-width="7" stroke-linecap="round"/>
  <path d="M658 382 C695 393 715 413 747 426" fill="none" stroke="#ffe8ea" stroke-width="7" stroke-linecap="round"/>
  <circle cx="764" cy="380" r="11" fill="#382544"/>
  <path d="M500 390 C570 390 602 390 643 388" fill="none" stroke="#ffd166" stroke-width="5"/>
  <text x="500" y="365" fill="#fff0bd" font-family="Arial, sans-serif" font-size="25" font-weight="700">intercepção de partículas</text>
  <text x="700" y="505" fill="#f8dce2" font-family="Arial, sans-serif" font-size="28" font-weight="700">Pelagothuria natatrix</text>
  <text x="700" y="536" fill="#dcecf0" font-family="Arial, sans-serif" font-size="21">consumidor na zona mesopelágica</text>
  <path d="M0 690 C170 652 340 718 535 680 S890 710 1200 665 V800 H0Z" fill="#26383c"/>
  <path d="M0 690 C170 652 340 718 535 680 S890 710 1200 665" fill="none" stroke="#7c928d" stroke-width="5"/>
  <text x="70" y="752" fill="#e6e2cf" font-family="Arial, sans-serif" font-size="28" font-weight="700">Fundo abissal</text>
  <text x="700" y="752" fill="#d3e4e5" font-family="Arial, sans-serif" font-size="22">O destino do carbono muda com cada consumidor</text>
</svg>
